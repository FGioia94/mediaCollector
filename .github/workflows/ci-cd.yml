name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-check:
    name: Backend compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile backend
        working-directory: backend
        run: ./mvnw -DskipTests compile

  frontend-check:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs:
      - backend-check
      - frontend-check
    if: github.event_name != 'pull_request'
    outputs:
      registry_owner: ${{ steps.vars.outputs.registry_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize registry owner
        id: vars
        shell: bash
        run: echo "registry_owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.vars.outputs.registry_owner }}/media-collector-backend:latest
            ghcr.io/${{ steps.vars.outputs.registry_owner }}/media-collector-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.vars.outputs.registry_owner }}/media-collector-frontend:latest
            ghcr.io/${{ steps.vars.outputs.registry_owner }}/media-collector-frontend:${{ github.sha }}

  deploy:
    name: Remote deploy
    runs-on: ubuntu-latest
    needs:
      - build-images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure remote deploy directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: mkdir -p "${{ secrets.DEPLOY_PATH }}"

      - name: Upload deployment bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "deploy/docker-compose.prod.yml,deploy/redeploy.sh"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            cat > .env.prod <<'EOF'
            REGISTRY_OWNER=${{ needs.build-images.outputs.registry_owner }}
            IMAGE_TAG=${{ github.sha }}
            BACKEND_PORT=${{ secrets.BACKEND_PORT }}
            FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}
            MEDIAHUB_NETWORK=${{ secrets.MEDIAHUB_NETWORK }}
            MEDIAHUB_DB_URL=${{ secrets.MEDIAHUB_DB_URL }}
            MEDIAHUB_DB_USERNAME=${{ secrets.MEDIAHUB_DB_USERNAME }}
            MEDIAHUB_DB_PASSWORD=${{ secrets.MEDIAHUB_DB_PASSWORD }}
            JWT_PASSWORD=${{ secrets.JWT_PASSWORD }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}
            MEDIAHUB_ADMIN_EMAIL=${{ secrets.MEDIAHUB_ADMIN_EMAIL }}
            MEDIAHUB_ADMIN_PASSWORD=${{ secrets.MEDIAHUB_ADMIN_PASSWORD }}
            MEDIAHUB_ADMIN_SYNC_PASSWORD_ON_STARTUP=false
            MEDIAHUB_FRONTEND_BASE_URL=${{ secrets.MEDIAHUB_FRONTEND_BASE_URL }}
            MEDIAHUB_PASSWORD_RESET_EXPIRATION_MINUTES=${{ secrets.MEDIAHUB_PASSWORD_RESET_EXPIRATION_MINUTES }}
            MEDIAHUB_SMTP_HOST=${{ secrets.MEDIAHUB_SMTP_HOST }}
            MEDIAHUB_SMTP_PORT=${{ secrets.MEDIAHUB_SMTP_PORT }}
            MEDIAHUB_SMTP_USERNAME=${{ secrets.MEDIAHUB_SMTP_USERNAME }}
            MEDIAHUB_SMTP_PASSWORD=${{ secrets.MEDIAHUB_SMTP_PASSWORD }}
            MEDIAHUB_SMTP_AUTH=${{ secrets.MEDIAHUB_SMTP_AUTH }}
            MEDIAHUB_SMTP_STARTTLS=${{ secrets.MEDIAHUB_SMTP_STARTTLS }}
            EOF
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            chmod +x redeploy.sh
            ./redeploy.sh
