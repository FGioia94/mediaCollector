services:
  mediahub-backend:
    image: ghcr.io/${REGISTRY_OWNER}/media-collector-backend:${IMAGE_TAG:-latest}
    container_name: mediahub-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - mediahub-net

  mediahub-frontend:
    image: ghcr.io/${REGISTRY_OWNER}/media-collector-frontend:${IMAGE_TAG:-latest}
    container_name: mediahub-frontend
    restart: unless-stopped
    depends_on:
      - mediahub-backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    networks:
      - mediahub-net

networks:
  mediahub-net:
    external: true
    name: ${MEDIAHUB_NETWORK:-mediahub-net}
